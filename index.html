<title>Colegio Bertha Von Glumer «Arcoíris» · Familias</title>

<!--
  ==========================================================================
  PANEL DE FAMILIAS · Colegio Bertha Von Glumer «Arcoiris» · LUMEN · ORBI
  --------------------------------------------------------------------------
  1) APPS_URL: la URL /exec de la app ORBI (ya viene puesta).
  2) CAL_ID: pega aqui el ID de tu Google Calendar PUBLICO para el calendario
     de eventos. Lo encuentras en: Google Calendar > (tu calendario) >
     Configuracion > "Integrar calendario" > ID del calendario.
     Si lo dejas vacio, el calendario muestra un aviso amable.
  ==========================================================================
-->
<script>
  var APPS_URL = "https://script.google.com/macros/s/AKfycbzvi0TpQlPlWRIgAMG-ADIOVlqMsnJfqrSummoQ4IYwRctOT-5l5tPAc6Cr-OJS43TY/exec";
  var CAL_ID   = "o0e19dfmd10cfn27o2u0vhu7kpp441v7@import.calendar.google.com";   // <-- pega aqui el ID de tu Google Calendar publico
</script>
<style>
  :root{--ink:#28331F;--paper:#F4EFE1;--card:#FFFDF6;--rule:#E5DCC4;--rule-2:#efe8d5;--soft:#6E7A5F;--muted:#94977F;--green:#4E7A38;--carmin:#B03A56;--gold:#C9B98F;--accent:#4E7A38;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{background:var(--paper);}
  body{background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;line-height:1.5;}
  .app{max-width:540px;margin:0 auto;background:var(--card);min-height:100vh;}
  /* Splash */
  .spl{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;transition:opacity .4s ease;}
  .spl.hide{opacity:0;pointer-events:none;}
  .spl img{width:88px;height:88px;object-fit:contain;animation:flotar 2.4s ease-in-out infinite;}
  .spl .nm{font-family:"Montserrat",sans-serif;font-weight:700;font-size:18px;color:var(--ink);text-align:center;line-height:1.3;}
  .spl .runner{width:150px;height:3px;background:var(--rule-2);border-radius:3px;overflow:hidden;position:relative;}
  .spl .runner::after{content:"";position:absolute;left:-40%;top:0;height:100%;width:40%;background:var(--accent);border-radius:3px;animation:correr 1.2s ease-in-out infinite;}
  .spl .slbl{font-family:"Montserrat",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--soft);}
  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes correr{0%{left:-40%}100%{left:100%}}
  /* Header institucional */
  header{background:var(--ink);color:#EAF1ED;padding:26px 22px 20px;text-align:center;}
  header .escudo{width:66px;height:auto;display:block;margin:0 auto 9px;}
  header .nom{font-family:"Montserrat",Georgia,serif;font-weight:700;font-size:19px;color:#F4EFE1;line-height:1.28;}
  header .lema{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:13px;color:var(--gold);margin-top:5px;}
  .tricolor{display:flex;height:5px;}
  .tricolor i{flex:1;display:block;}
  /* Contenido */
  .ctx{padding:22px 22px 8px;}
  .hi{font-family:"Montserrat";font-weight:600;font-size:18px;color:var(--ink);}
  .hi-sub{font-size:13.5px;color:var(--soft);margin-top:3px;}
  .sec-lbl{font-family:"Montserrat",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);margin:22px 22px 10px;}
  .cards{padding:0 22px;display:flex;flex-direction:column;gap:12px;}
  .card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:16px 16px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;}
  .card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(40,51,31,.08);border-color:#d8cead;}
  .card .ic{width:46px;height:46px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .card .ic svg{width:23px;height:23px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .card .tx .t{font-family:"Montserrat";font-weight:600;font-size:15px;color:var(--ink);line-height:1.2;}
  .card .tx .s{font-size:12.5px;color:var(--soft);margin-top:3px;}
  .card .arw{margin-left:auto;color:var(--muted);font-size:22px;line-height:1;}
  .ic-green{background:var(--green);}
  .ic-carmin{background:var(--carmin);}
  /* Calendario */
  .cal-wrap{padding:0 22px;}
  .cal-box{border:1.5px solid var(--rule);border-radius:14px;overflow:hidden;background:#fff;}
  .cal-box iframe{display:block;width:100%;height:420px;border:0;}
  .cal-empty{border:1.5px dashed #d8cead;border-radius:14px;padding:26px 20px;text-align:center;color:var(--soft);font-size:13.5px;line-height:1.55;}
  .cal-empty b{color:var(--ink);}
  .foot{text-align:center;padding:26px 22px 34px;}
  .foot .col{font-size:12px;color:var(--soft);}
  .foot .marca{font-family:"Montserrat",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--muted);margin-top:8px;}
  /* Vista trámite (iframe en la misma página) */
  .modbar{position:sticky;top:0;z-index:6;background:var(--paper);display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--rule-2);}
  .modbar .volver{font-family:"Montserrat",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:10px;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);padding:9px 14px;border-radius:20px;cursor:pointer;}
  .modbar .mt{font-family:"Montserrat",sans-serif;font-weight:700;font-size:12.5px;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;}
  #frameWrap{position:relative;background:var(--paper);}
  #modframe{width:100%;height:calc(100vh - 52px);border:0;display:block;background:var(--paper);}
  .msplash{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .msplash img{width:78px;height:78px;object-fit:contain;animation:flotar 2.4s ease-in-out infinite;}
  .msplash .runner{width:140px;height:3px;background:var(--rule-2);border-radius:3px;overflow:hidden;position:relative;}
  .msplash .runner::after{content:"";position:absolute;left:-40%;top:0;height:100%;width:40%;background:var(--accent);border-radius:3px;animation:correr 1.2s ease-in-out infinite;}
  .msplash .slbl{font-family:"Montserrat",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--soft);}
</style>
</head>

<script>
(function(){
  var U_PERMISO = APPS_URL;
  var U_SALIDA  = APPS_URL + "?a=salidapapa";

  // Enlazar tarjetas
  var cards = document.querySelectorAll('.card');
  cards[0].setAttribute('data-url', U_PERMISO);
  cards[1].setAttribute('data-url', U_SALIDA);
  for (var i=0;i<cards.length;i++){
    cards[i].addEventListener('click', function(){
      abrir(this.getAttribute('data-url'), this.getAttribute('data-t'));
    });
  }

  function abrir(url, titulo){
    document.getElementById('modtitulo').textContent = titulo || '';
    document.getElementById('vistaHome').style.display = 'none';
    document.getElementById('vistaMod').style.display = 'block';
    var sp = document.getElementById('msplash'); sp.style.display = 'flex';
    var f = document.getElementById('modframe');
    f.onload = function(){ sp.style.display = 'none'; };
    f.src = url;
    window.scrollTo(0,0);
  }
  document.getElementById('btnVolver').addEventListener('click', function(){
    document.getElementById('vistaMod').style.display = 'none';
    var f = document.getElementById('modframe'); f.onload = null; f.src = 'about:blank';
    document.getElementById('vistaHome').style.display = 'block';
  });

  // Calendario
  var calWrap = document.getElementById('calWrap');
  if (CAL_ID && CAL_ID.trim()){
    var src = 'https://calendar.google.com/calendar/embed?src=' + encodeURIComponent(CAL_ID.trim()) +
              '&ctz=America%2FMexico_City&mode=AGENDA&showTitle=0&showNav=1&showPrint=0&showCalendars=0&showTz=0';
    calWrap.innerHTML = '<div class="cal-box"><iframe src="' + src + '" loading="lazy"></iframe></div>';
  } else {
    calWrap.innerHTML = '<div class="cal-empty">El calendario aparecerá aquí en cuanto se configure. <br><b>Para activarlo:</b> pega el ID de tu Google Calendar público en la variable <b>CAL_ID</b> (arriba en el archivo).</div>';
  }

  // Ocultar splash
  function ocultar(){ var sp=document.getElementById('splash'); if(sp){ sp.classList.add('hide'); setTimeout(function(){ if(sp&&sp.parentNode) sp.parentNode.removeChild(sp); },450); } }
  if (document.readyState === 'complete') ocultar();
  else window.addEventListener('load', ocultar);
  setTimeout(ocultar, 3500);
})();
</script>
